name: Fork Android Test APK

# Fork-only test build. It never runs in the official repository, uses the
# debug keystore instead of release signing, and installs as a separate app
# (org.edgeever.mobile.test) next to the Play-signed EdgeEver.
on:
  push:
    branches:
      - "test/android-apk-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository != 'tianma-if/edgeever'
    name: Build debug-signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        run: bun run typecheck:mobile

      - name: Prepare mobile icons
        run: bun run prepare:mobile:icons

      - name: Use a separate test application id
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/mobile/app.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.expo.name = "EdgeEver Test";
            config.expo.android.package = "org.edgeever.mobile.test";
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: bunx expo prebuild --platform android --no-install

      - name: Build release APK with debug signing
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename APK
        run: |
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          mkdir -p dist
          cp "$apk" "dist/edgeever-test-${GITHUB_SHA::8}-arm64-v8a.apk"
          sha256sum dist/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edgeever-android-test-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
