# Fork-only Android preview builds for issue #652 (models.dev fallback, PR #809). Lives on a
# CI branch only and must never be merged upstream. Put "[only:android]" or "[only:android-x86]"
# in the head commit message to build one job. Signed with the fork's throwaway preview key,
# for testing only.
name: models.dev fallback preview builds

on:
  push:
    branches:
      - yulei666/models-dev-fallback-ci
  workflow_dispatch:

concurrency:
  group: models-dev-fallback-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository == 'yulei666/edgeever' && (!contains(github.event.head_commit.message, '[only:') || contains(github.event.head_commit.message, '[only:android]'))
    name: Android arm64 APK (preview key)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:mobile
      - name: Restore preview signing key
        # The fork's fixed preview key (shared with earlier preview builds), so newer preview
        # APKs install over older ones. Unrelated to the official release key.
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.TOTP_PREVIEW_ANDROID_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.TOTP_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64" && test -n "$PREVIEW_KEYSTORE_PASSWORD"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/preview.p12"
          password="$PREVIEW_KEYSTORE_PASSWORD"
          digest="$(keytool -exportcert -keystore "$RUNNER_TEMP/preview.p12" -storetype PKCS12 \
            -storepass "$password" -alias preview | openssl dgst -sha256 -r | cut -d' ' -f1)"
          echo "Preview signer SHA-256: $digest"
          {
            echo "EDGE_EVER_ANDROID_ALLOWED_SIGNER_SHA256=$digest"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/preview.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=preview"
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build APK
        env:
          EDGE_EVER_ANDROID_APK_ARCHS: arm64-v8a
        run: bun run build:android:apk
      - uses: actions/upload-artifact@v6
        with:
          name: edgeever-auto-budget-preview-android-arm64
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  android-x86:
    if: github.repository == 'yulei666/edgeever' && (!contains(github.event.head_commit.message, '[only:') || contains(github.event.head_commit.message, '[only:android-x86]'))
    name: Android x86_64 APK (preview key, for instabox)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:mobile
      - name: Restore preview signing key
        # The fork's fixed preview key (shared with earlier preview builds), so newer preview
        # APKs install over older ones. Unrelated to the official release key.
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.TOTP_PREVIEW_ANDROID_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.TOTP_PREVIEW_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64" && test -n "$PREVIEW_KEYSTORE_PASSWORD"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/preview.p12"
          password="$PREVIEW_KEYSTORE_PASSWORD"
          digest="$(keytool -exportcert -keystore "$RUNNER_TEMP/preview.p12" -storetype PKCS12 \
            -storepass "$password" -alias preview | openssl dgst -sha256 -r | cut -d' ' -f1)"
          echo "Preview signer SHA-256: $digest"
          {
            echo "EDGE_EVER_ANDROID_ALLOWED_SIGNER_SHA256=$digest"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/preview.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=preview"
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build APK
        env:
          EDGE_EVER_ANDROID_APK_ARCHS: x86_64
        run: bun run build:android:apk
      - uses: actions/upload-artifact@v6
        with:
          name: edgeever-preview-android-x86_64
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
